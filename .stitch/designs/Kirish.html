<!DOCTYPE html>

<html lang="uz"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#e7236a",
                        "background-light": "#f8f6f7",
                        "background-dark": "#211117",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: "Plus Jakarta Sans", sans-serif;
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 min-h-screen flex flex-col">
<div class="relative flex min-h-screen w-full flex-col overflow-x-hidden">
<div class="layout-container flex h-full grow flex-col">
<!-- Header/TopNavBar -->
<header class="flex items-center justify-between border-b border-primary/10 px-6 py-4 lg:px-40 bg-background-light dark:bg-background-dark">
<div class="flex items-center gap-3">
<div class="flex items-center justify-center w-10 h-10 rounded-xl bg-primary text-white">
<span class="material-symbols-outlined">local_florist</span>
</div>
<h2 class="text-xl font-bold tracking-tight text-slate-900 dark:text-slate-100">Gulso 1.0</h2>
</div>
<div class="flex items-center gap-4">
<button class="text-sm font-medium text-slate-600 dark:text-slate-400">Yordam</button>
</div>
</header>
<!-- Main Content Area -->
<main class="flex flex-1 items-center justify-center px-4 py-12">
<div class="w-full max-w-[440px] flex flex-col gap-8">
<!-- Brand Section -->
<div class="flex flex-col items-center text-center gap-4">
<div class="w-24 h-24 rounded-3xl bg-primary/10 flex items-center justify-center mb-2 overflow-hidden">
<div class="w-full h-full bg-gradient-to-br from-primary/20 to-primary/40" data-alt="Abstract pink and magenta floral pattern gradient"></div>
</div>
<h1 class="text-3xl font-bold text-slate-900 dark:text-slate-100">Xush kelibsiz</h1>
<p class="text-slate-600 dark:text-slate-400">Davom etish uchun ma'lumotlaringizni kiriting</p>
</div>
<!-- Tabs/Toggle -->
<div class="border-b border-slate-200 dark:border-slate-800">
<div class="flex gap-8 justify-center">
<button class="pb-3 border-b-2 border-primary text-primary font-bold text-sm transition-colors">
                                Kirish
                            </button>
<button class="pb-3 border-b-2 border-transparent text-slate-500 dark:text-slate-400 font-bold text-sm hover:text-primary transition-colors">
                                Ro'yxatdan o'tish
                            </button>
</div>
</div>
<!-- Form Section -->
<form class="flex flex-col gap-5">
<!-- Full Name (Optional) -->
<div class="flex flex-col gap-2">
<label class="text-sm font-semibold text-slate-700 dark:text-slate-300 px-1">F.I.SH (Ixtiyoriy)</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-primary transition-colors">person</span>
<input class="w-full pl-12 pr-4 py-3.5 rounded-xl border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all dark:text-white" placeholder="Ismingizni kiriting" type="text"/>
</div>
</div>
<!-- Phone Number -->
<div class="flex flex-col gap-2">
<label class="text-sm font-semibold text-slate-700 dark:text-slate-300 px-1">Telefon raqami</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-primary transition-colors">call</span>
<div class="absolute left-12 top-1/2 -translate-y-1/2 text-slate-600 dark:text-slate-400 font-medium pointer-events-none">
                                    +998
                                </div>
<input class="w-full pl-24 pr-4 py-3.5 rounded-xl border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all dark:text-white" maxlength="12" placeholder="00 000 00 00" type="tel"/>
</div>
<p class="text-xs text-slate-500 dark:text-slate-500 px-1">Tasdiqlash kodi ushbu raqamga SMS orqali yuboriladi</p>
</div>
<!-- Action Button -->
<button class="w-full bg-primary hover:bg-primary/90 text-white font-bold py-4 rounded-xl shadow-lg shadow-primary/20 transition-all flex items-center justify-center gap-2 mt-2" type="submit">
<span>Kodni yuborish</span>
<span class="material-symbols-outlined text-lg">arrow_forward</span>
</button>
</form>
<!-- Footer Links -->
<div class="text-center">
<p class="text-sm text-slate-500 dark:text-slate-500">
                            Davom etish orqali siz bizning 
                            <a class="text-primary hover:underline font-medium" href="#">Foydalanish shartlari</a>ga rozilik bildirasiz.
                        </p>
</div>
</div>
</main>
<!-- Bottom Navigation / Footer -->
<footer class="py-8 px-6 text-center text-slate-400 dark:text-slate-600 text-xs">
                © 2024 Gulso 1.0. Barcha huquqlar himoyalangan.
            </footer>
</div>
</div>
</body></html>
